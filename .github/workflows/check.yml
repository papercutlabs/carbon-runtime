name: check

on: [push, pull_request]

# Where the job runs. One expression, and the job name never changes, so the required check
# `check` is the same check wherever it ran:
# 1. a pull request from a fork runs on GitHub's hosted runner, always: this repository is
#    public, and a stranger's code never reaches a self-hosted runner;
# 2. a branch starting with the repository variable CARBON_RUNTIME_CI_TRIAL_REF runs where
#    CARBON_RUNTIME_CI_TRIAL_RUNS_ON says, so one branch can try a runner pool without moving
#    anyone;
# 3. otherwise the repository variable CARBON_RUNTIME_CI_RUNS_ON, a JSON runs-on value: a
#    self-hosted pool's labels, or "ubuntu-24.04" when the pool's watchdog has flipped it back;
# 4. with no variable set, ubuntu-24.04, as before.
jobs:
  check:
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '"ubuntu-24.04"' || (vars.CARBON_RUNTIME_CI_TRIAL_REF != '' && startsWith(github.head_ref || github.ref_name, vars.CARBON_RUNTIME_CI_TRIAL_REF)) && vars.CARBON_RUNTIME_CI_TRIAL_RUNS_ON || vars.CARBON_RUNTIME_CI_RUNS_ON || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The runtime libraries are pinned exactly.
      # TypeScript is installed for checking only. Installing from the lockfile
      # proves both pins resolve, and --ignore-scripts keeps package hooks out.
      - name: install pinned runtime and check dependencies
        run: npm ci --ignore-scripts

      - name: typecheck
        run: npm run typecheck

      - name: runtime and development dependencies are pinned exactly
        run: |
          node -e '
            const pkg = require("./package.json");
            const declared = pkg.dependencies ?? {};
            const names = Object.keys(declared);
            if (JSON.stringify(names.sort()) !== JSON.stringify(["@whiskeysockets/baileys", "postgres"].sort())) {
              throw new Error("this release names the WhatsApp library and PostgreSQL client");
            }
            for (const name of names) if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(declared[name])) {
              throw new Error(`${name} is not pinned to an exact version`);
            }
            const dev = pkg.devDependencies ?? {};
            if (Object.keys(dev).length !== 1 || Object.keys(dev)[0] !== "typescript"
                || !/^\d+\.\d+\.\d+$/.test(dev.typescript)) {
              throw new Error("TypeScript is the only development dependency and is pinned exactly");
            }
          '

      - name: test files are present
        run: |
          node -e '
            const tests = require("node:fs").readdirSync("test").filter((name) => name.endsWith(".test.mjs") || name.endsWith(".test.ts"));
            if (tests.length === 0) throw new Error("the node --test glob found no test modules");
          '

      # A self-hosted runner image may carry 17.11 already, built for its own distribution; a
      # hosted runner installs it here.
      - name: install pinned PostgreSQL 17 for records integration tests
        run: |
          if /usr/lib/postgresql/17/bin/pg_config --version 2>/dev/null | grep -qE '^PostgreSQL 17[.]11( |$)'; then
            echo "PostgreSQL 17.11 is already installed on this runner"; exit 0
          fi
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o "$RUNNER_TEMP/pgdg.asc"
          echo "0144068502a1eddd2a0280ede10ef607d1ec592ce819940991203941564e8e76  $RUNNER_TEMP/pgdg.asc" | sha256sum -c -
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          sudo install -m 0644 "$RUNNER_TEMP/pgdg.asc" /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: noble-pgdg\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends postgresql-17=17.11-1.pgdg24.04+2 postgresql-client-17=17.11-1.pgdg24.04+2
          /usr/lib/postgresql/17/bin/pg_config --version | grep -q '^PostgreSQL 17.11'

      - name: node --test
        run: npm test

      # Is this still the shape it says it is. Every rule carries its own reason;
      # `node tools/shape-check.ts --help` prints them. Four rules need both
      # halves of Carbon and are not run here: the other half is private, so a
      # workflow in a public repository cannot fetch it without carrying a
      # credential that reads it. Those four run in the private half's workflow,
      # which checks this repository out because this one is public.
      - name: the shape holds
        run: node tools/shape-check.ts .

      - name: the fixture adapter passes the twenty-three cases
        run: node bin/carbon-stream check --adapter adapters/fixture --fixtures adapters/fixture/fixtures

      - name: the WhatsApp adapter passes its subset
        run: node bin/carbon-stream check --adapter adapters/whatsapp --fixtures adapters/whatsapp/fixtures

      - name: the history import passes its subset
        run: node bin/carbon-stream check --adapter import/carbon-capture-whatsapp --fixtures import/fixtures

      - name: the outbound import passes its subset
        run: node bin/carbon-stream check --adapter import/carbon-ledger-outbound --fixtures import/outbound-fixtures

      - name: the email adapter passes the cases that apply to it
        run: node bin/carbon-stream check --adapter adapters/email --fixtures adapters/email/fixtures

      - name: the Telegram adapter passes its subset
        run: node bin/carbon-stream check --adapter adapters/telegram --fixtures adapters/telegram/fixtures

      # The copied files are copies. Nothing here edits them; the authority is
      # the private half, whose own test compares the two byte for byte when
      # both checkouts are present. What this can check without that checkout is
      # that the provenance file still names a commit, and that nothing has been
      # added to the copied trees that the authority does not have.
      - name: the copied harness says where it came from
        run: |
          grep -qE "^source commit +[0-9a-f]{40}$" harness/HARNESS-SOURCE
          test ! -d harness/codex/verifications

      # A client agent keeps what arrived. There is no path here that deletes a
      # record, and this is what keeps it that way: a library that grows one
      # takes a client's evidence with it.
      - name: no path that drops a client's records
        run: |
          if grep -rniE "prune|retention" stream adapters import conformance bin runtime; then
            echo "the lines above would take a client's records away; this repository has no such path"
            exit 1
          fi

      - name: no client, internal, machine or person name in a public tree
        run: node tools/scan-identifiers.ts .

      # A box has no registry and no reason to reach one, so the dependency ships
      # inside the tarball. This is the step that would have caught the first
      # release, which installed onto a box with no node_modules at all and a
      # WhatsApp channel that could not start.
      - name: the release tarball builds, and carries its dependency
        run: |
          node tools/release.ts --out "$RUNNER_TEMP/dist"
          ls "$RUNNER_TEMP"/dist/carbon-runtime-*.tar.gz.sha256
          mkdir -p "$RUNNER_TEMP/unpacked"
          tar -xzf "$RUNNER_TEMP"/dist/carbon-runtime-*.tar.gz -C "$RUNNER_TEMP/unpacked"
          cd "$RUNNER_TEMP/unpacked"
          node -e 'import("@whiskeysockets/baileys").then((m) => {
            if (typeof m.makeWASocket !== "function") throw new Error("the tarball carries a WhatsApp library that does not load");
          })'
          node -e 'import("postgres").then((m) => { if (typeof m.default !== "function") throw new Error("the PostgreSQL client does not load") })'
          node bin/carbon-runtime --help > /dev/null
          node bin/carbon-records --help > /dev/null
